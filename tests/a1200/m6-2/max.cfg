// Bench-Max: Quake III's highest graphics settings at 1600x1200, copied as
// autoexec.cfg into each run's home (run at start-up, before the renderer).
// Textures full size and 32-bit, trilinear; the most detailed models and
// curves; dynamic lights, flares, detail textures, sky, sun, marks, shadows.
// r_primitives 0: one glDrawElements a batch (MiniGL's fastest too).
seta r_fullscreen "1"
seta r_mode "9"
seta r_colorbits "32"
seta r_depthbits "24"
seta r_texturebits "32"
seta r_picmip "0"
seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR"
seta r_ext_compressed_textures "0"
seta r_lodbias "-2"
seta r_subdivisions "1"
seta r_lodCurveError "10000"
seta r_vertexlight "0"
seta r_dynamiclight "1"
seta r_flares "1"
seta r_detailtextures "1"
seta r_fastsky "0"
seta r_drawSun "1"
seta cg_shadows "1"
seta cg_marks "1"
seta cg_simpleItems "0"
seta r_primitives "0"
seta s_initsound "0"
